# Local PostgreSQL 16 with PostGIS and pgvector for development (ADR 0004, ADR 0010).
services:
  db:
    build:
      context: ./db
    environment:
      POSTGRES_USER: landora
      POSTGRES_PASSWORD: landora
      POSTGRES_DB: landora
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U landora -d landora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
